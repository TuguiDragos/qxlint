name: qxlint
description: Deterministic static checks for Qiskit Primitives V2 workflows
author: Tugui Dragos

branding:
  icon: check-square
  color: purple

inputs:
  paths:
    description: Files or directories to analyse, one per line
    required: false
    default: "."
  format:
    description: Output format, one of text, json, sarif
    required: false
    default: text
  output:
    description: Write the output to this file instead of stdout
    required: false
    default: ""
  select:
    description: Comma separated rule codes or prefixes to run
    required: false
    default: ""
  ignore:
    description: Comma separated rule codes or prefixes to skip
    required: false
    default: ""
  target-qiskit:
    description: Target Qiskit version or specifier
    required: false
    default: ""
  target-runtime:
    description: Target qiskit-ibm-runtime version or specifier
    required: false
    default: ""
  version:
    description: >-
      qxlint version specifier to install, for example ==0.3.0 or >=0.3.
      Empty installs the version this action was checked out at.
    required: false
    default: ""
  python-version:
    description: Python version to run under
    required: false
    default: "3.13"
  fail-on-findings:
    description: Fail the step when qxlint reports findings
    required: false
    default: "true"

outputs:
  exit-code:
    description: qxlint exit code, 0 clean, 1 findings, 2 could not run
    value: ${{ steps.qxlint.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}

    # Every input reaches the shell through env rather than through ${{ }}.
    # GitHub substitutes an expression into the script text before bash parses
    # it, so an input containing a quote or a semicolon would be read as shell
    # syntax. An environment variable is data, whatever is in it.
    - name: Install qxlint
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # An empty version input pins to the ref this action was checked out
        # at, so `uses: TuguiDragos/qxlint@v0.3.0` really runs qxlint 0.3.0.
        # It used to install whatever PyPI had that day, which meant the tag
        # chose the action and something else chose the analyser.
        spec="$INPUT_VERSION"
        if [ -z "$spec" ]; then
          spec="==$(tr -d '[:space:]' < "$ACTION_PATH/VERSION")"
        fi
        python -m pip install --disable-pip-version-check "qxlint${spec}"
        qxlint --version

    - name: Run qxlint
      id: qxlint
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SELECT: ${{ inputs.select }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_TARGET_QISKIT: ${{ inputs.target-qiskit }}
        INPUT_TARGET_RUNTIME: ${{ inputs.target-runtime }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        # One path per line. Splitting on whitespace made `notebooks/my demo`
        # two paths, and nothing in the input can say which spaces separate and
        # which belong to a name. `read` without -d takes one line at a time and
        # trims the ends of it, so an indented YAML block still works, and it
        # never evaluates what it reads.
        paths=()
        while read -r line || [ -n "$line" ]; do
          # A CRLF checkout on a Windows runner leaves the carriage return
          # attached to the name, and no such file exists.
          line="${line%$'\r'}"
          [ -n "$line" ] && paths+=("$line")
        done <<< "$INPUT_PATHS"
        [ ${#paths[@]} -eq 0 ] && paths=(.)
        args=("${paths[@]}" --format "$INPUT_FORMAT" --no-color)
        [ -n "$INPUT_SELECT" ] && args+=(--select "$INPUT_SELECT")
        [ -n "$INPUT_IGNORE" ] && args+=(--ignore "$INPUT_IGNORE")
        [ -n "$INPUT_TARGET_QISKIT" ] && args+=(--target-qiskit "$INPUT_TARGET_QISKIT")
        [ -n "$INPUT_TARGET_RUNTIME" ] && args+=(--target-runtime "$INPUT_TARGET_RUNTIME")

        set +e
        if [ -n "$INPUT_OUTPUT" ]; then
          qxlint "${args[@]}" > "$INPUT_OUTPUT"
        else
          qxlint "${args[@]}"
        fi
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 2 ]; then
          echo "::error::qxlint could not run"
          exit 2
        fi
        if [ "$code" -eq 1 ] && [ "$INPUT_FAIL_ON_FINDINGS" = "true" ]; then
          exit 1
        fi
        exit 0
