version: 2

# Three ecosystems ship from this repository and each pins versions somewhere
# different. Without this, a pinned action or hook goes stale silently: the uv
# setup action sat two majors behind because its major tag stopped moving and
# nothing was watching the releases.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: monthly
    groups:
      vscode-extension:
        patterns: ["*"]
    # @types/vscode has to match engines.vscode, the oldest VS Code the
    # extension supports, and vsce refuses to package when it is newer. Raising
    # it means dropping editors, which is decided by hand with engines, not by a
    # monthly bump.
    ignore:
      - dependency-name: "@types/vscode"
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"

  # The website's highlighter. A release that colors code differently stops the
  # build instead of reaching the page.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
