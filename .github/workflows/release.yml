name: Release

# One tag publishes to all three registries, in dependency order:
#   PyPI                 -> the analyser itself, everything else launches it
#   npm                  -> `npx @tuguidragos/qxlint`
#   VS Code Marketplace  -> the editor extension
#
# Each stage waits for the one before it, so a failed PyPI publish never leaves
# an extension in the marketplace pointing at a version that does not exist.
#
# A GitHub release is drafted once all of them succeed.

on:
  push:
    tags: ["v*"]
  # A manual run builds and validates without publishing: every publishing job
  # is gated on the ref being a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Read the version and check every manifest agrees
        id: version
        run: |
          version=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "python package: $version"

          for manifest in npm/package.json vscode/package.json; do
            other=$(uv run python -c "import json;print(json.load(open('$manifest'))['version'])")
            echo "$manifest: $other"
            if [ "$other" != "$version" ]; then
              echo "::error::$manifest is $other but pyproject.toml is $version"
              exit 1
            fi
          done

          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $version"
            exit 1
          fi

      - run: uv sync --extra circuit
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
      - run: uv run mypy

  build-python:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  build-extension:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - working-directory: vscode
        run: npm ci
      - working-directory: vscode
        run: npx vsce package --out qxlint-${{ needs.verify.outputs.version }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/*.vsix

  testpypi:
    needs: build-python
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Requires a reviewer on the environment, so production is never automatic.
    # Trusted publishing means no token is ever stored for PyPI.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The action fails by default on a version the index already has, which
      # would make a tag unrecoverable: once this job has uploaded, any later
      # job failing leaves the re-run dying here, so npm and the marketplace
      # never get their second chance and the version has to be burnt.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    needs: pypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # npm trusted publishing cannot perform a package's FIRST publish, so
      # 0.1.0 goes out manually and `npm trust` is configured afterwards. From
      # then on this step needs no token.
      #
      # `npm publish` refuses to publish over an existing version, and there is
      # no --skip-duplicate for it. Every other stage of this release is
      # re-runnable, so the check is done here instead: without it, re-running a
      # tag, or tagging the version that was published by hand, fails the job.
      - name: Publish to npm unless the version is already there
        working-directory: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@tuguidragos/qxlint@$version" version > /dev/null 2>&1; then
            echo "@tuguidragos/qxlint@$version is already published, skipping"
            exit 0
          fi
          npm publish

  marketplace:
    # build-extension is what uploads the vsix this job downloads, so it has to
    # be waited on. Without it the two are only ordered by luck of timing.
    needs: [pypi, build-extension]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # vsce still requires an Azure DevOps PAT. Its --oidc trusted publishing
      # exists only on the `next` tag, is hidden from help, and the marketplace
      # side is not documented yet, so it is deliberately not used here.
      # Azure DevOps global PATs retire on 2026-12-01.
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce@^3.9.2 publish --packagePath vsix/*.vsix --skip-duplicate

  github-release:
    # pyproject.toml points its Changelog URL at this page, and the extension's
    # changelog refers readers to it for the rule changes. A tag that publishes
    # to three registries without leaving a release here leaves both pointing
    # at an empty page.
    #
    # Drafted rather than published, because the changelog is written in the
    # release itself and drafting is what leaves room to write it. Publishing it
    # by hand is also where the Actions Marketplace listing gets ticked.
    needs: [npm, marketplace]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The sdist and the wheel are the exact files PyPI received, so what was
      # published can be checked without going through PyPI.
      #
      # There is no checkout in this job, so gh needs to be told the repository.
      # Re-running a tag must not fail on the release the first run drafted,
      # which is why an existing one is updated instead of created.
      - name: Draft the release with the files that went to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft --title "$GITHUB_REF_NAME" --notes ""
          fi
