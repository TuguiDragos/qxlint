name: Release

# One tag publishes to all three registries, in dependency order:
#   PyPI                 -> the analyser itself, everything else launches it
#   npm                  -> `npx @tuguidragos/qxlint`
#   VS Code Marketplace  -> the editor extension
#
# Each stage waits for the one before it, so a failed PyPI publish never leaves
# an extension in the marketplace pointing at a version that does not exist.
#
# A GitHub release is drafted once all of them succeed.

on:
  push:
    tags: ["v*"]
  # A manual run builds and validates without publishing: every publishing job
  # is gated on the ref being a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Read the version and check every manifest agrees
        id: version
        run: |
          version=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "python package: $version"

          for manifest in npm/package.json vscode/package.json; do
            other=$(uv run python -c "import json;print(json.load(open('$manifest'))['version'])")
            echo "$manifest: $other"
            if [ "$other" != "$version" ]; then
              echo "::error::$manifest is $other but pyproject.toml is $version"
              exit 1
            fi
          done

          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $version"
            exit 1
          fi

      - run: uv sync --extra circuit
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
      - run: uv run mypy

  build-python:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore signing, and the store the attestation lands in. A job level
      # permissions block replaces the workflow default, so contents is
      # restated above rather than inherited.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build

      # PyPI gets its own PEP 740 attestation from the publish action, which
      # says only that a trusted publisher uploaded the file. This one carries
      # the commit, the workflow and the runner, and it is what
      # `gh attestation verify <file> --repo TuguiDragos/qxlint` reads. The two
      # live in different stores and do not collide.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  build-extension:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - working-directory: vscode
        run: npm ci
      - working-directory: vscode
        run: npx vsce package --out qxlint-${{ needs.verify.outputs.version }}.vsix

      # Neither the Marketplace nor Open VSX lets a publisher sign a VSIX, but
      # both serve the SHA-256 of the file they hold, and both match this
      # build byte for byte. Attesting it here is what turns that into a chain
      # a user can follow from the installed extension back to this commit.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: vscode/*.vsix

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix
          path: vscode/*.vsix

  testpypi:
    needs: build-python
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Requires a reviewer on the environment, so production is never automatic.
    # Trusted publishing means no token is ever stored for PyPI.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      # The action fails by default on a version the index already has, which
      # would make a tag unrecoverable: once this job has uploaded, any later
      # job failing leaves the re-run dying here, so npm and the marketplace
      # never get their second chance and the version has to be burnt.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  npm:
    needs: pypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # npm trusted publishing cannot perform a package's FIRST publish, so
      # 0.1.0 goes out manually and `npm trust` is configured afterwards. From
      # then on this step needs no token.
      #
      # `npm publish` refuses to publish over an existing version, and there is
      # no --skip-duplicate for it. Every other stage of this release is
      # re-runnable, so the check is done here instead: without it, re-running a
      # tag, or tagging the version that was published by hand, fails the job.
      - name: Publish to npm unless the version is already there
        working-directory: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@tuguidragos/qxlint@$version" version > /dev/null 2>&1; then
            echo "@tuguidragos/qxlint@$version is already published, skipping"
            exit 0
          fi
          npm publish

  marketplace:
    # build-extension is what uploads the vsix this job downloads, so it has to
    # be waited on. Without it the two are only ordered by luck of timing.
    needs: [pypi, build-extension]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix
          path: vsix/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # VSCE_PAT is an Azure DevOps global PAT, and those retire on 2026-12-01.
      # Microsoft Entra ID replaces it: a managed identity trusts this
      # environment's OIDC token, so no token is stored. It takes over as soon
      # as the environment has AZURE_CLIENT_ID and AZURE_TENANT_ID variables;
      # until then the PAT publishes as before. vsce's own --oidc trusted
      # publishing is still hidden from help and only settling on prereleases,
      # so it is deliberately not used here.
      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: VS Code Marketplace, signed in with Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath vsix/*.vsix --skip-duplicate --azure-credential

      - name: VS Code Marketplace, with VSCE_PAT
        if: vars.AZURE_CLIENT_ID == ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath vsix/*.vsix --skip-duplicate

  marketplace-identity:
    # A publisher can only add the Entra identity as a member by the ID the
    # Marketplace gives it, and only the identity itself can ask for that ID. A
    # manual run asks, which also proves the sign in works before a tag depends
    # on it. Nothing is published.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps, which the
      # Marketplace runs on. The id printed here is what the publisher's
      # Members page accepts, with the Contributor role.
      - name: The ID to add to the Marketplace publisher
        if: vars.AZURE_CLIENT_ID != ''
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      # Fails until that ID is a member of the publisher and passes once it is,
      # so a second manual run proves the next tag will reach the Marketplace.
      - name: The identity can publish as the extension's publisher
        if: vars.AZURE_CLIENT_ID != ''
        working-directory: vscode
        run: |
          publisher=$(node -p "require('./package.json').publisher")
          npx --yes @vscode/vsce@3.9.2 verify-pat --azure-credential "$publisher"

  open-vsx:
    # The registry VSCodium, Cursor, Windsurf and Theia use. Its own job rather
    # than a step in `marketplace`, so a failure here cannot fail a job whose
    # Marketplace publish already succeeded. Nothing depends on this one.
    needs: [pypi, build-extension]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix
          path: vsix/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # The namespace must exist before the first publish and is created by
      # hand, not here: creating it needs a token, and doing it on every tag
      # would be a no-op at best.
      #
      # Trusted publishing means no token is stored for Open VSX either. It
      # trusts release.yml running in this environment, and exchanges the job's
      # OIDC token for one that lasts minutes and can publish this extension
      # only. ovsx has had --trusted-publishing since 1.1.0.
      - name: Open VSX
        run: npx --yes ovsx@1.1.1 publish --packagePath vsix/*.vsix --skip-duplicate --trusted-publishing

  github-release:
    # pyproject.toml points its Changelog URL at this page, and the extension's
    # changelog refers readers to it for the rule changes. A tag that publishes
    # to three registries without leaving a release here leaves both pointing
    # at an empty page.
    #
    # Drafted rather than published, because the changelog is written in the
    # release itself and drafting is what leaves room to write it. Publishing it
    # by hand is also where the Actions Marketplace listing gets ticked.
    needs: [npm, marketplace]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      # The VSIX too. Neither extension registry lets a publisher sign, so the
      # only way to check an installed extension against this build is to have
      # the file it was built from somewhere public.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vsix
          path: dist/

      # The sdist and the wheel are the exact files PyPI received, so what was
      # published can be checked without going through PyPI.
      #
      # There is no checkout in this job, so gh needs to be told the repository.
      # Re-running a tag must not fail on the release the first run drafted,
      # which is why an existing one is updated instead of created.
      - name: Draft the release with the files that went to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft --title "$GITHUB_REF_NAME" --notes ""
          fi

      # A draft is invisible to everyone but the maintainer, and the Changelog
      # URL on PyPI points straight at this page. Both 0.1.0 and 0.1.1 sat
      # drafted and unnoticed, so the last step says so out loud.
      - name: Say that the release still has to be published
        run: |
          echo "::notice title=Release drafted::Write the notes and publish \
          $GITHUB_REF_NAME at https://github.com/$GITHUB_REPOSITORY/releases. \
          Until then the Changelog link on PyPI shows an empty page."
