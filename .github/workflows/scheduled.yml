name: Upstream drift

# The API model is hardcoded so that Engine A works without Qiskit installed.
# That is only safe if something notices when upstream moves, so this job runs
# the suite against the latest releases and fails loudly rather than waiting for
# a user to report it.

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    name: latest ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [qiskit, qiskit-ibm-runtime, both]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # ci.yml pins this for the same reason: without it the job runs
          # whatever interpreter the runner image happens to ship.
          python-version: "3.13"
      - run: uv sync --extra circuit

      - name: Upgrade
        run: |
          case "${{ matrix.package }}" in
            qiskit)             uv pip install -U qiskit ;;
            qiskit-ibm-runtime) uv pip install -U qiskit-ibm-runtime ;;
            both)               uv pip install -U qiskit qiskit-ibm-runtime ;;
          esac
          # Every `uv run` re-syncs from the lockfile first, which put the
          # pinned versions straight back. This job existed to catch an
          # upstream change and was quietly testing the pinned versions.
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"

      - name: The versions under test really are the latest
        run: |
          uv run python - <<'EOF'
          import subprocess
          import qiskit
          import qiskit_ibm_runtime
          print("qiskit", qiskit.__version__, "| runtime", qiskit_ibm_runtime.__version__)
          frozen = subprocess.run(
              ["uv", "pip", "list", "--format=freeze"], capture_output=True, text=True
          ).stdout
          print(frozen)
          EOF

      - name: Tests
        run: uv run pytest -q

      - name: Re-verify the hardcoded API model against the installed packages
        run: uv run python scripts/verify_model.py
