name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} ${{ matrix.qiskit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        qiskit: [pinned]
        include:
          # Engine A must work with no Qiskit installed at all. This is the job
          # that proves it, not a comment in the README.
          - python: "3.13"
            qiskit: none
          # The exact floor declared in pyproject.toml, so the claim stays
          # a regression test once the latest release moves past it.
          - python: "3.11"
            qiskit: minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Without this every job in the matrix ran whatever interpreter the
          # runner image happened to ship, so six differently named jobs all
          # tested CPython 3.12 and the 3.11 to 3.14 claim was never checked.
          python-version: ${{ matrix.python }}

      - name: Install (no Qiskit)
        if: matrix.qiskit == 'none'
        # `uv sync` alone still installed Qiskit: qiskit-ibm-runtime is a test
        # dependency and depends on it. This job spent its life claiming to
        # prove something it was not testing, so it now excludes that group and
        # then checks that Qiskit really is absent.
        run: |
          uv sync --no-group runtime
          uv run --no-sync python -c "
          import importlib.util
          assert importlib.util.find_spec('qiskit') is None, 'qiskit is installed here'
          print('qiskit is absent')
          "

      - name: Install (pinned Qiskit)
        if: matrix.qiskit == 'pinned'
        run: uv sync --extra circuit

      - name: Install (minimum Qiskit)
        if: matrix.qiskit == 'minimum'
        # qiskit-ibm-runtime is left out. Its current release imports
        # qiskit.circuit.Annotation, which Qiskit 2.0 does not have, so keeping
        # it would make this job test that incompatibility instead of the floor
        # qxlint declares. The tests that need it skip themselves. This only
        # became visible once the job stopped having its downgrade undone.
        run: |
          uv sync --extra circuit --no-group runtime
          uv pip install "qiskit==2.0.*"

      - name: Later steps must not undo the install above
        # Every `uv run` re-syncs from the lockfile first, which put the pinned
        # Qiskit back before pytest started. The minimum job was testing 2.5
        # twice and the floor in pyproject.toml had no regression test at all.
        run: echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"

      - name: The Qiskit under test is the one this job is named after
        run: |
          uv run python - <<'EOF'
          import importlib.util
          import os
          want = os.environ["MATRIX_QISKIT"]
          if importlib.util.find_spec("qiskit") is None:
              found = "none"
          else:
              import qiskit
              found = qiskit.__version__
          print(f"qiskit: {found}")
          if want == "none":
              assert found == "none", found
          elif want == "minimum":
              assert found.startswith("2.0."), found
          else:
              assert found != "none", found
          EOF
        env:
          MATRIX_QISKIT: ${{ matrix.qiskit }}

      # The job name is a label. This is the interpreter.
      - name: The interpreter is the one this job is named after
        run: |
          uv run python -VV
          uv run python -c "
          import sys
          want = '${{ matrix.python }}'
          got = '%d.%d' % sys.version_info[:2]
          assert got == want, f'job says {want}, interpreter is {got}'
          "

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Ruff format
        run: uv run ruff format --check src tests scripts

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      - name: Coverage gate
        # Only on the pinned interpreter: the others would need Qiskit present
        # to reach the circuit rules, and the gate is absolute.
        if: matrix.python == '3.13' && matrix.qiskit == 'pinned'
        run: uv run pytest -q --cov --cov-report=term

      - name: The API model still matches the installed Qiskit
        # model.py is a hardcoded table and nothing else in CI notices when it
        # drifts. A wrong constant there passes the tests, the coverage gate,
        # ruff and mypy; only this script catches it. It needs Qiskit, so it
        # runs wherever Qiskit is pinned.
        if: matrix.qiskit == 'pinned'
        run: uv run python scripts/verify_model.py

      - name: Generated docs are current
        run: |
          uv run python scripts/generate_docs.py
          git diff --exit-code docs/rules

      - name: Self check
        run: uv run qxlint src tests/fixtures/clean

  flake8-plugin:
    name: flake8 plugin registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install . flake8
      - name: The QXL entry point is registered and selectable
        run: |
          flake8 --select=QXL tests/fixtures/positive/qxl101_get_counts.py \
            | tee out.txt
          grep -q QXL101 out.txt
      - name: A clean fixture reports nothing
        run: flake8 --select=QXL tests/fixtures/clean

  action:
    name: composite action
    runs-on: ubuntu-latest
    # The action installs from PyPI, so it runs against the last published
    # release rather than this commit. That still exercises everything the
    # action itself owns: argument building, the exit code contract, the
    # output file and paths that contain a space.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags, so the version below is derived rather than written down.
          fetch-depth: 0

      - name: Pin the action to the last released version
        # This was a literal and went two releases stale, so the job exercised
        # 0.1.1 long after 0.3.0 shipped. Reading the newest tag cannot.
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          test -n "$latest"
          echo "PUBLISHED===${latest#v}" >> "$GITHUB_ENV"

      - name: action.yml is well formed
        run: |
          python - <<'EOF'
          import sys
          try:
              import yaml
          except ImportError:
              sys.exit(0)
          spec = yaml.safe_load(open("action.yml"))
          assert spec["runs"]["using"] == "composite", spec["runs"]
          assert spec["inputs"]["paths"]["default"] == "."
          assert spec["outputs"]["exit-code"]
          print("action.yml ok")
          EOF

      - name: A clean tree passes and reports exit code zero
        id: clean
        uses: ./
        with:
          paths: tests/fixtures/clean
          version: ${{ env.PUBLISHED }}
      - run: test "${{ steps.clean.outputs.exit-code }}" = "0"

      - name: Findings fail the step when asked to
        id: strict
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/positive
          version: ${{ env.PUBLISHED }}
      - run: test "${{ steps.strict.outcome }}" = "failure"
      - run: test "${{ steps.strict.outputs.exit-code }}" = "1"

      - name: Findings do not fail the step when told not to
        id: lenient
        uses: ./
        with:
          paths: tests/fixtures/positive
          fail-on-findings: "false"
          version: ${{ env.PUBLISHED }}
      - run: test "${{ steps.lenient.outputs.exit-code }}" = "1"

      - name: SARIF reaches the output file
        uses: ./
        with:
          paths: tests/fixtures/positive
          format: sarif
          output: qxlint.sarif
          fail-on-findings: "false"
          version: ${{ env.PUBLISHED }}
      - run: |
          python -c "
          import json
          report = json.load(open('qxlint.sarif'))
          assert report['runs'][0]['results'], 'no SARIF results'
          print(len(report['runs'][0]['results']), 'results')
          "

      - name: A path containing a space is one path
        run: |
          mkdir -p "quantum notebooks"
          cp tests/fixtures/positive/qxl103_unmeasured.py "quantum notebooks/demo one.py"
      - id: spaced
        continue-on-error: true
        uses: ./
        with:
          paths: quantum notebooks/demo one.py
          version: ${{ env.PUBLISHED }}
      # Exit 1 is findings, which proves the file was found and analysed.
      # Splitting on spaces gave exit 2, "path does not exist: quantum".
      - run: test "${{ steps.spaced.outputs.exit-code }}" = "1"

      - name: Several paths, one per line
        id: many
        continue-on-error: true
        uses: ./
        with:
          paths: |
            tests/fixtures/clean
            quantum notebooks/demo one.py
          version: ${{ env.PUBLISHED }}
      - run: test "${{ steps.many.outputs.exit-code }}" = "1"

      - name: An input that looks like shell is data, not code
        id: hostile
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/clean
          select: QXL101; touch /tmp/pwned
          version: ${{ env.PUBLISHED }}
      - run: |
          test ! -e /tmp/pwned
          test "${{ steps.hostile.outcome }}" = "failure"

      - name: The default version input pins to the VERSION file
        run: |
          grep -q 'ACTION_PATH/VERSION' action.yml
          test "$(cat VERSION)" = "$(python -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")"

  npm:
    name: npm launcher (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24"]
        include:
          # The floor package.json declares, so it is proven rather than assumed.
          - os: ubuntu-latest
            node: "20"
    # The launcher has a whole resolution path that only exists on Windows:
    # PATHEXT handling, and the py launcher. Testing it on Linux alone left
    # that code with no coverage anywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install .
      - run: node --check npm/bin/qxlint.js
      - working-directory: npm
        run: npm test

      - name: Direct invocation propagates the exit code
        working-directory: npm
        run: |
          node bin/qxlint.js --version
          node bin/qxlint.js ../tests/fixtures/clean
          set +e
          node bin/qxlint.js ../tests/fixtures/positive
          test $? -eq 1

      # Running the file directly misses what npx does to PATH: it puts
      # node_modules/.bin first, where qxlint is this launcher. That is how the
      # launcher came to call itself without ever finishing, so the packed
      # package has to be installed and driven through npx here.
      - name: npx runs the installed package
        timeout-minutes: 5
        run: |
          set -e
          npm pack ./npm --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/npx-check"
          cd "$RUNNER_TEMP/npx-check"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/*qxlint-*.tgz
          npx --no-install qxlint --version
          npx --no-install qxlint "$GITHUB_WORKSPACE/tests/fixtures/clean"
          set +e
          npx --no-install qxlint "$GITHUB_WORKSPACE/tests/fixtures/positive"
          test $? -eq 1

      - working-directory: npm
        run: npm pack --dry-run

  vscode:
    name: vs code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - working-directory: vscode
        run: npm ci
      - working-directory: vscode
        run: npm run typecheck
      - working-directory: vscode
        run: npm test
      - working-directory: vscode
        run: npm run compile

      # core.test.ts covers the pure functions. This runs the extension inside a
      # real editor and reads the diagnostics it produces, which is the only way
      # to catch a wrong coordinate or a notebook finding placed on the file
      # instead of the cell. xvfb is how VS Code documents running this on Linux,
      # and Linux is where it runs: a headless editor on the other two runners is
      # a different problem from the one this test is here to catch.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: runner.os == 'Linux'
        with:
          python-version: "3.13"
      - run: pip install .
        if: runner.os == 'Linux'
      - name: Extension tests in a real editor
        if: runner.os == 'Linux'
        working-directory: vscode
        timeout-minutes: 15
        env:
          QXLINT_TEST_PATH: qxlint
        run: xvfb-run -a npm run test:e2e

      # vsce validates the manifest, so a bad engines range or a missing
      # LICENSE fails here rather than at release time.
      - working-directory: vscode
        run: npx vsce package --out qxlint.vsix
      - working-directory: vscode
        run: npx vsce ls
